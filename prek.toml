minimum_prek_version = "0.4.9"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
fail_fast = false

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "detect-private-key" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-added-large-files", args = ["--maxkb=1000"], exclude = "(^|/)uv\\.lock$|^document-worker/tests/fixtures/real/.*\\.pdf$" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "debug-statements", files = "^document-worker/(src|tests|scripts|eval)/.*\\.py$" },
  { id = "name-tests-test", args = ["--pytest-test-first"], files = "^document-worker/tests/.*\\.py$" },
  { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
  { id = "validate-pyproject", files = "(^|/)pyproject\\.toml$" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.0"
hooks = [
  { id = "ruff-check", args = ["--fix", "--exit-non-zero-on-fix"], files = "^document-worker/.*\\.py$" },
  { id = "ruff-format", files = "^document-worker/.*\\.py$" },
]

# --------------------------- локальные хуки (все на language = "system") ---------------------------
[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy --strict (document-worker)"
language = "system"
entry = "uv run --directory document-worker mypy src tests"
files = "^document-worker/(src|tests)/.*\\.py$"
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "import-linter"
name = "import-linter: границы слоёв"
language = "system"
entry = "uv run --directory document-worker lint-imports"
files = "^document-worker/(src/.*\\.py|pyproject\\.toml)$"
pass_filenames = false
require_serial = true

[[repos.hooks]]
id = "deptry"
name = "deptry: неиспользуемые и необъявленные зависимости"
language = "system"
entry = "uv run --directory document-worker deptry src"
files = "^document-worker/(src/.*\\.py|pyproject\\.toml)$"
pass_filenames = false

[[repos.hooks]]
id = "uv-lock-check"
name = "uv.lock синхронизирован с pyproject.toml"
language = "system"
entry = "uv lock --check --directory document-worker"
files = "^document-worker/(pyproject\\.toml|uv\\.lock)$"
pass_filenames = false

[[repos.hooks]]
id = "commit-message-format"
name = "формат коммита: feature|fix|docs: описание"
language = "system"
entry = "python scripts/check_commit_message.py"
stages = ["commit-msg"]

[[repos.hooks]]
id = "pytest-unit"
name = "pytest unit (pre-push)"
language = "system"
entry = "uv run --directory document-worker pytest tests/unit -q -p no:randomly --no-cov"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[project]
name = "document-worker"
version = "0.1.0"
description = "Обработка юридических документов: текстовый слой, OCR, нормализация, chunking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Александр Рябов", email = "alexander.ryabov.002@gmail.com" }]
dependencies = [
    "faststream[rabbit]>=0.7.3,<0.8",
    "pydantic>=2.13,<3",
    "uvicorn>=0.42,<0.43",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.31.0,<0.32",
    "alembic>=1.18.5,<2",
    "aioboto3>=15.5.0,<16",
    "aiobotocore>=2.25,<3",
    "botocore>=1.40,<2",
    "pdfplumber>=0.11.10,<0.12",
    "pypdfium2>=5.12.1,<6",
    "pikepdf>=10.10.0,<11",
    "pillow>=12.3.0,<13",
]

[project.scripts]
document-worker = "document_worker.bootstrap.entrypoint:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["document_worker"]

[tool.uv]
required-version = ">=0.9.26"
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "typing" }]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "coverage[toml]>=7.15.2",
    "hypothesis>=6.145",
    "testcontainers[postgres,minio,rabbitmq]>=4.15.0",
]
lint = ["ruff>=0.16.0", "import-linter>=2.13", "deptry>=0.25.1", "pip-audit>=2.10.1"]
typing = [
    "mypy>=2.3.0",
    "asyncpg-stubs>=0.31.3",
    "types-aioboto3[s3]>=15.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [".", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["ALL"]
# D203/D213 и COM812/ISC001 конфликтуют между собой и с ruff-format;
# RUF001-003 — кириллица в строках и комментариях;
# N818 — доменные ошибки именуются языком домена, суффикс Error несёт DomainError
ignore = ["D203", "D213", "COM812", "ISC001", "TD002", "TD003", "FIX002",
          "EM101", "EM102", "TRY003", "ANN401", "RUF001", "RUF002", "RUF003",
          "CPY001", "N818"]
flake8-tidy-imports.ban-relative-imports = "all"
pydocstyle.convention = "google"
mccabe.max-complexity = 8
isort.known-first-party = ["document_worker"]
isort.required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "pydantic.BaseModel", "pydantic_settings.BaseSettings", "sqlalchemy.orm.DeclarativeBase",
    # Mapped[...] резолвится SQLAlchemy в рантайме, а наследование от DeclarativeBase
    # ruff по цепочке не отслеживает — нужен именно наш Base.
    "document_worker.infrastructure.persistence.base.Base",
    # Ruff не идёт по цепочке наследования, а контракты наследуются от своей
    # базы, а не от BaseModel напрямую.
    "document_worker.presentation.messaging.contracts.base.IncomingMessageBase",
]
# fast_depends резолвит аннотации обработчика через get_type_hints() в рантайме,
# поэтому их импорты нельзя прятать в блок TYPE_CHECKING.
runtime-evaluated-decorators = ["faststream.asgi.get", "faststream.asgi.post"]

[tool.ruff.lint.per-file-ignores]
# INP001: тесты импортируются в режиме importlib, файлы __init__.py им не нужны
# ASYNC240: тесты работают с файлами синхронно — это проверка, а не рабочий цикл
"tests/**/*.py" = ["S101", "PLR2004", "D100", "D101", "D102", "D103", "ANN201", "SLF001",
                   "INP001", "ASYNC240"]
"migrations/**/*.py" = ["INP001", "D", "ERA001"]
"scripts/**/*.py" = ["INP001", "T201"]
"document_worker/bootstrap/**/*.py" = ["PLR0913"]   # composition root: много параметров — норма

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["document_worker"]
plugins = ["pydantic.mypy"]
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
disallow_any_generics = true
extra_checks = true
show_error_codes = true
pretty = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "truthy-iterable",
    "ignore-without-code", "unused-awaitable", "explicit-override", "mutable-override",
    "narrowed-type-not-subtype"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

# У pypdfium2 и pdfplumber нет py.typed; стабов в typeshed тоже нет.
[[tool.mypy.overrides]]
module = ["pypdfium2.*", "pdfplumber.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.importlinter]
root_package = "document_worker"
include_external_packages = true       # без этого forbidden-контракты ничего не проверяют
exclude_type_checking_imports = false  # обход границы через TYPE_CHECKING — тоже нарушение

[[tool.importlinter.contracts]]
id = "layers"
name = "Слои Clean Architecture"
type = "layers"
layers = [
    "document_worker.bootstrap",
    "document_worker.presentation | document_worker.infrastructure",
    "document_worker.application",
    "document_worker.domain",
]

[[tool.importlinter.contracts]]
id = "domain-purity"
name = "Domain не зависит от фреймворков и внешних библиотек"
type = "forbidden"
source_modules = ["document_worker.domain"]
forbidden_modules = [
    "document_worker.application", "document_worker.infrastructure",
    "document_worker.presentation", "document_worker.bootstrap",
    "pydantic", "pydantic_settings", "pydantic_core", "sqlalchemy", "alembic", "asyncpg",
    "greenlet", "faststream", "aio_pika", "aiormq", "uvicorn", "aioboto3", "aiobotocore",
    "boto3", "botocore", "pypdfium2", "pdfplumber", "pdfminer", "pikepdf", "PIL", "cv2",
    "numpy", "rapidocr", "onnxruntime", "tiktoken", "filetype", "platformdirs", "structlog",
    "orjson", "tenacity", "prometheus_client", "dishka", "dishka_faststream",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "application-purity"
name = "Application зависит только от Domain и собственных портов"
type = "forbidden"
source_modules = ["document_worker.application"]
forbidden_modules = [
    "document_worker.infrastructure", "document_worker.presentation",
    "document_worker.bootstrap",
    "pydantic", "pydantic_settings", "sqlalchemy", "alembic", "asyncpg", "faststream",
    "aio_pika", "uvicorn", "aioboto3", "aiobotocore", "boto3", "botocore", "pypdfium2",
    "pdfplumber", "pdfminer", "pikepdf", "PIL", "cv2", "numpy", "rapidocr", "onnxruntime",
    "tiktoken", "filetype", "structlog", "orjson", "tenacity", "prometheus_client",
    "dishka", "dishka_faststream",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "no-agpl"
name = "Запрет AGPL-зависимостей (PyMuPDF)"
type = "forbidden"
source_modules = ["document_worker"]
forbidden_modules = ["fitz", "pymupdf"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
id = "di-isolation"
name = "DI-контейнер виден только в bootstrap"
type = "forbidden"
source_modules = [
    "document_worker.domain", "document_worker.application",
    "document_worker.infrastructure",
]
forbidden_modules = ["dishka", "dishka_faststream"]

[[tool.importlinter.contracts]]
id = "no-orm-in-presentation"
name = "Presentation не знает про ORM и хранилища"
type = "forbidden"
source_modules = ["document_worker.presentation"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic", "aioboto3", "aiobotocore", "botocore"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--timeout=180",
    "--cov=document_worker",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:.reports/coverage.xml",
]
asyncio_mode = "auto"
# Контейнер поднимается один раз на прогон, поэтому фикстуры и тесты обязаны
# жить в одном цикле событий.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: чистые тесты без внешних зависимостей",
    "integration: требуют testcontainers (postgres/rabbitmq/minio)",
    "e2e: полный сценарий обработки документа",
    "slow: OCR на реальных сканах и сборка образа (>5 c)",
    "eval: оценка качества на корпусе, по умолчанию отключена",
]
filterwarnings = [
    "error",
    # testcontainers ругается на собственный декоратор ожидания готовности
    # прямо при импорте модуля RabbitMQ; починить это может только он сам.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["document_worker"]
branch = true
parallel = true
concurrency = ["thread", "greenlet", "multiprocessing"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "^\\s*\\.\\.\\.$",
]

[tool.deptry]
known_first_party = ["document_worker"]

[tool.deptry.per_rule_ignores]
# pillow нужен pypdfium2 для to_pil(); напрямую его импортируют только тесты
DEP002 = ["uvicorn", "asyncpg", "pillow"]

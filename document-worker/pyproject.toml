[project]
name = "document-worker"
version = "0.1.0"
description = "Обработка юридических документов: текстовый слой, OCR, нормализация, chunking"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Александр Рябов", email = "alexander.ryabov.002@gmail.com" }]
dependencies = [
    "faststream[rabbit]>=0.7.3,<0.8",
    "uvicorn>=0.42,<0.43",
]

[project.scripts]
document-worker = "document_worker.bootstrap.entrypoint:run"   # ADR-0008

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_worker"]

[tool.uv]
required-version = ">=0.9.26"
package = true
default-groups = ["dev"]

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "typing" }]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "pytest-timeout>=2.4.0",
    "coverage[toml]>=7.15.2",
]
lint = ["ruff>=0.16.0", "import-linter>=2.13", "deptry>=0.25.1"]
typing = ["mypy>=2.3.0"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--timeout=180",
    "--cov=document_worker",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:.reports/coverage.xml",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: чистые тесты без внешних зависимостей",
    "integration: требуют testcontainers (postgres/rabbitmq/minio)",
    "e2e: полный сценарий обработки документа",
    "slow: OCR на реальных сканах и сборка образа (>5 c)",
    "eval: оценка качества на корпусе, по умолчанию отключена",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/document_worker"]
branch = true
parallel = true
concurrency = ["thread", "greenlet"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "class .*\\(Protocol\\):",
    "^\\s*\\.\\.\\.$",
]

[tool.deptry]
known_first_party = ["document_worker"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn"]   # нужен рантайму, импортируется только в entrypoint через uvicorn.run

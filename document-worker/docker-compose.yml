# Локальный стек сервиса. Миграции и создание бакета — одноразовые задачи:
# воркер стартует только после того, как они завершились успешно.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: document_worker
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: documents
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U document_worker -d documents"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: document_worker
      RABBITMQ_DEFAULT_PASS: change-me
      RABBITMQ_DEFAULT_VHOST: documents
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minio-admin change-me &&
        mc mb --ignore-existing local/documents

  migrator:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE__DSN: postgresql+asyncpg://document_worker:change-me@postgres:5432/documents
    entrypoint: ["/usr/bin/tini", "-g", "--"]
    command: ["alembic", "upgrade", "head"]

  worker:
    build:
      context: .
    depends_on:
      migrator:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE__DSN: postgresql+asyncpg://document_worker:change-me@postgres:5432/documents
      RABBIT__URL: amqp://document_worker:change-me@rabbitmq:5672/documents
      S3__ENDPOINT_URL: http://minio:9000
      S3__ACCESS_KEY: minio-admin
      S3__SECRET_KEY: change-me
      RABBIT__DECLARE_AUDIT_QUEUE: "true"
    ports:
      - "8080:8080"
    # Обработка длинного документа доходит до часа: убить контейнер раньше
    # значит потерять её и потратить попытку.
    stop_grace_period: 90s
    tmpfs:
      - /tmp/document-worker:size=4g

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:

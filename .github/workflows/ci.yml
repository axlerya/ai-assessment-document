name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: document-worker

env:
  UV_VERSION: "0.9.26"

jobs:
  lint:
    name: Линтер и формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "document-worker/uv.lock"
      - run: uv sync --frozen
      - name: uv.lock синхронизирован с pyproject.toml
        run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Типизация
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "document-worker/uv.lock"
      - run: uv sync --frozen
      - run: uv run mypy --strict document_worker tests eval

  arch:
    name: Границы слоёв и зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "document-worker/uv.lock"
      - run: uv sync --frozen
      - name: Контракты import-linter
        run: uv run lint-imports --show-timings
      - name: Неиспользуемые и необъявленные зависимости
        run: uv run deptry .
      - name: Известные уязвимости в зависимостях
        run: uv run pip-audit

  integration:
    name: Интеграционные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "document-worker/uv.lock"
      - run: uv sync --frozen
      # Модели распознавания весят тринадцать мегабайт и меняются только вместе
      # с реестром: кэш делает скачивание разовым.
      - name: Кэш моделей распознавания
        uses: actions/cache@v4
        with:
          path: document-worker/.models
          key: ocr-models-${{ hashFiles('document-worker/document_worker/infrastructure/ocr/model_registry.py') }}
      - name: Схема на живом PostgreSQL, хранилище на MinIO и топология на RabbitMQ
        # Порог покрытия проверяется по объединённым данным всех уровней,
        # а не по одному интеграционному прогону.
        run: uv run pytest -m "integration and not slow" --cov-fail-under=0
      - name: Сквозные сценарии на поднятом сервисе
        run: uv run pytest -m e2e --cov-fail-under=0

  unit:
    name: Unit-тесты (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "document-worker/uv.lock"
      - run: uv sync --frozen
      # Тесты корпуса рисуют кириллицу закреплённым шрифтом: без него они не
      # проверяют ничего, а качать его на каждый прогон незачем.
      - name: Кэш шрифтов корпуса
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fonts
          key: corpus-fonts-${{ hashFiles('document-worker/eval/fonts.py') }}
      - run: uv run pytest -m unit
        env:
          EVAL__FONT_DIR: ${{ github.workspace }}/.fonts
